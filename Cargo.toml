[package]
name = "ClipKeeper"
version = "0.9.3"
edition = "2021"

[dependencies]
slint = { version = "1.16.1", features = ["unstable-winit-030"] }
arboard = "3.6.1"
tray-icon = "0.23.0"
rdev = "0.5.3"
core-graphics = "0.25.0"
dispatch = "=0.2.0"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication"] }
objc2-foundation = "0.3.2"
dirs = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
entrait = "0.7.1"

[build-dependencies]
slint-build = "1.16.1"
winresource = "0.1.31"
