[package]
name = "ClipKeeper"
version = "0.9.3"
edition = "2021"

[dependencies]
slint = { version = "1.18.1", features = ["unstable-winit-030"] }
arboard = "3.6.1"
tray-icon = "0.26.1"
rdev = "0.5.3"
core-graphics = "0.25.0"
dispatch = "=0.2.0"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication"] }
objc2-foundation = "0.3.2"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
entrait = "0.7.1"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.27.0"

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.34"
